name: Daily SEO Blog

on:
  schedule:
    # 00:30 IST = 19:00 UTC previous day
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Rewrite existing posts instead of publishing a new one: 'all', a number (e.g. 5), or leave empty"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate blog content
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          REGENERATE: ${{ github.event.inputs.regenerate }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::OPENAI_API_KEY is not set — using the local composer."
          fi
          if [ -n "$REGENERATE" ]; then
            node scripts/generate-daily-blog.mjs --regenerate "$REGENERATE"
          else
            node scripts/generate-daily-blog.mjs
          fi

      - name: Commit and push
        run: |
          git config user.name "altmash-blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add blog blog-feed.json blog-feed.js sitemap.xml robots.txt
          if git diff --staged --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          if [ -n "${{ github.event.inputs.regenerate }}" ]; then
            git commit -m "content: regenerate blog posts ($(date -u +%F))"
          else
            git commit -m "content: publish daily SEO blog $(date -u +%F)"
          fi
          git pull --rebase origin main
          git push
