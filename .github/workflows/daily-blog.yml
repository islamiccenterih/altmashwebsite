name: Daily SEO Blog

on:
  schedule:
    # 00:30 IST = 19:00 UTC previous day
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate daily blog post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node scripts/generate-daily-blog.mjs

      - name: Commit and push
        run: |
          git config user.name "altmash-blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add blog blog-feed.json blog-feed.js sitemap.xml robots.txt
          if git diff --staged --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "content: publish daily SEO blog $(date -u +%F)"
          git push
